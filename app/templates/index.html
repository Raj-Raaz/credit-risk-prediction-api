<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Risk Prediction</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f7fb;
            min-height: 100vh;
        }
        
        .form-card {
            max-width: 850px;
            border-radius: 15px;
        }
    </style>
</head>

<body class="py-5 px-3">

    <div class="container">
        <!-- Main Form Card -->
        <div class="card form-card shadow-sm mx-auto border-0 p-4 p-md-5 bg-white">
            
            <div class="text-center mb-4">
                <h1 class="fw-bold text-dark fs-2 mb-2">Credit Risk Prediction</h1>
                <p class="text-secondary">Assess the credit default risk of a loan applicant</p>
            </div>

            <form id="predictionForm">
                <div class="row g-3">
                    
                    <!-- Age -->
                    <div class="col-12 col-md-6">
                        <label for="person_age" class="form-label fw-semibold text-dark">Age</label>
                        <input type="number" class="form-control" id="person_age" min="18" max="100" required>
                    </div>

                    <!-- Annual Income -->
                    <div class="col-12 col-md-6">
                        <label for="person_income" class="form-label fw-semibold text-dark">Annual Income</label>
                        <input type="number" class="form-control" id="person_income" min="1" step="0.01" required>
                    </div>

                    <!-- Home Ownership -->
                    <div class="col-12 col-md-6">
                        <label for="person_home_ownership" class="form-label fw-semibold text-dark">Home Ownership</label>
                        <select class="form-select" id="person_home_ownership" required>
                            <option value="">Select</option>
                            <option value="RENT">RENT</option>
                            <option value="OWN">OWN</option>
                            <option value="MORTGAGE">MORTGAGE</option>
                            <option value="OTHER">OTHER</option>
                        </select>
                        <!-- Invisible spacer to balance the helper text on the right -->
                        <div class="form-text invisible">Spacer</div>
                    </div>

                    <!-- Employment Length -->
                    <div class="col-12 col-md-6">
                        <label for="person_emp_length" class="form-label fw-semibold text-dark">Employment Length (Years)</label>
                        <input type="number" class="form-control" id="person_emp_length" min="0" step="0.1">
                        <div class="form-text">Leave empty if unknown</div>
                    </div>

                    <!-- Loan Intent -->
                    <div class="col-12 col-md-6">
                        <label for="loan_intent" class="form-label fw-semibold text-dark">Loan Intent</label>
                        <select class="form-select" id="loan_intent" required>
                            <option value="">Select</option>
                            <option value="PERSONAL">PERSONAL</option>
                            <option value="EDUCATION">EDUCATION</option>
                            <option value="MEDICAL">MEDICAL</option>
                            <option value="VENTURE">VENTURE</option>
                            <option value="HOMEIMPROVEMENT">HOME IMPROVEMENT</option>
                            <option value="DEBTCONSOLIDATION">DEBT CONSOLIDATION</option>
                        </select>
                    </div>

                    <!-- Loan Grade -->
                    <div class="col-12 col-md-6">
                        <label for="loan_grade" class="form-label fw-semibold text-dark">Loan Grade</label>
                        <select class="form-select" id="loan_grade" required>
                            <option value="">Select</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                            <option value="E">E</option>
                            <option value="F">F</option>
                            <option value="G">G</option>
                        </select>
                    </div>

                    <!-- Loan Amount -->
                    <div class="col-12 col-md-6">
                        <label for="loan_amnt" class="form-label fw-semibold text-dark">Loan Amount</label>
                        <input type="number" class="form-control" id="loan_amnt" min="1" step="0.01" required>
                        <!-- Invisible spacer to balance the helper text on the right -->
                        <div class="form-text invisible">Spacer</div>
                    </div>

                    <!-- Loan Interest Rate -->
                    <div class="col-12 col-md-6">
                        <label for="loan_int_rate" class="form-label fw-semibold text-dark">Loan Interest Rate (%)</label>
                        <input type="number" class="form-control" id="loan_int_rate" min="0" max="100" step="0.01">
                        <div class="form-text">Leave empty if unknown</div>
                    </div>

                    <!-- Previous Default -->
                    <div class="col-12 col-md-6">
                        <label for="cb_person_default_on_file" class="form-label fw-semibold text-dark">Previous Default on File</label>
                        <select class="form-select" id="cb_person_default_on_file" required>
                            <option value="">Select</option>
                            <option value="Y">Yes</option>
                            <option value="N">No</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="cb_person_cred_hist_length" class="form-label fw-semibold text-dark">Credit History Length (Years)</label>
                        <input type="number" class="form-control" id="cb_person_cred_hist_length" min="0" required>
                    </div>

                    <!-- Submit Button -->
                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-primary w-100 py-2 fs-5 fw-semibold" id="predictButton">
                            Predict Credit Risk
                        </button>
                    </div>

                </div>
            </form>

            <div id="resultBox" class="alert alert-info mt-4 text-center d-none">
                <h3 id="resultText" class="text-dark mb-3"></h3>
                <p class="mb-1 text-dark">
                    <strong>Prediction:</strong> <span id="predictionText"></span>
                </p>
                <p class="mb-0 text-dark">
                    <strong>Default Probability:</strong> <span id="probabilityText"></span>
                </p>
            </div>

            <div id="errorBox" class="alert alert-danger mt-4 d-none">
                <strong>Error:</strong> <span id="errorText"></span>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const form = document.getElementById("predictionForm");
        const predictButton = document.getElementById("predictButton");
        const resultBox = document.getElementById("resultBox");
        const resultText = document.getElementById("resultText");
        const predictionText = document.getElementById("predictionText");
        const probabilityText = document.getElementById("probabilityText");
        const errorBox = document.getElementById("errorBox");
        const errorText = document.getElementById("errorText");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            // Hide boxes
            resultBox.classList.add("d-none");
            errorBox.classList.add("d-none");

            predictButton.disabled = true;
            predictButton.textContent = "Predicting...";

            const data = {
                person_age: Number(document.getElementById("person_age").value),
                person_income: Number(document.getElementById("person_income").value),
                person_home_ownership: document.getElementById("person_home_ownership").value,
                
                person_emp_length: document.getElementById("person_emp_length").value === ""
                    ? null
                    : Number(document.getElementById("person_emp_length").value),
                    
                loan_intent: document.getElementById("loan_intent").value,
                loan_grade: document.getElementById("loan_grade").value,
                loan_amnt: Number(document.getElementById("loan_amnt").value),
                
                loan_int_rate: document.getElementById("loan_int_rate").value === ""
                    ? null
                    : Number(document.getElementById("loan_int_rate").value),
                    
                cb_person_default_on_file: document.getElementById("cb_person_default_on_file").value,
                cb_person_cred_hist_length: Number(document.getElementById("cb_person_cred_hist_length").value)
            };

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok) {
                    let message = "Prediction failed.";
                    if (Array.isArray(result.detail)) {
                        message = result.detail.map(error => error.msg).join(", ");
                    } else if (result.detail) {
                        message = result.detail;
                    }
                    throw new Error(message);
                }

                resultText.textContent = result.result;
                predictionText.textContent = result.prediction;
                probabilityText.textContent = (result.default_probability * 100).toFixed(2) + "%";

                resultBox.classList.remove("d-none");

            } catch (error) {
                console.error(error);
                errorText.textContent = error.message;
                errorBox.classList.remove("d-none");
            } finally {
                predictButton.disabled = false;
                predictButton.textContent = "Predict Credit Risk";
            }
        });
    </script>

</body>
</html>
